# Reusable pipeline: lint -> unit tests -> build Setup.exe -> test the installer.
# Not triggered on its own; ci.yml and release.yml call it, so a release is
# always built by exactly the steps that CI runs on every push.
name: Build

on:
  workflow_call:
    inputs:
      sign:
        description: Sign converter.exe and Setup.exe with SignPath (releases only)
        type: boolean
        default: false
    outputs:
      version:
        description: Version from converter_app/__init__.py
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read
  actions: read  # SignPath downloads the unsigned files from this run's artifacts

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check . --output-format=github

      - name: Unit tests
        run: python -m pytest Test -v -p no:warnings --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python }}
          path: test-results.xml

  package:
    name: Build installer
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # the Python bundled into converter.exe
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Some antivirus engines flag the prebuilt PyInstaller bootloader, because
      # malware packed with PyInstaller uses the same file. Compiling our own
      # (MSVC is preinstalled on the runner) makes converter.exe a different binary.
      - name: Rebuild the PyInstaller bootloader from source
        shell: pwsh
        run: |
          $version = (Select-String -Path requirements-dev.txt -Pattern '^pyinstaller==(.+)$').Matches[0].Groups[1].Value
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --force-reinstall --no-deps --no-cache-dir --no-binary pyinstaller "pyinstaller==$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $loader = python -c "import PyInstaller, pathlib; print(pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe')"
          if ((Get-Item $loader).LastWriteTime -lt (Get-Date).AddMinutes(-30)) { throw "The bootloader was not rebuilt: $loader" }
          Write-Host "Bootloader built: $loader"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build (PyInstaller + smoke test + Inno Setup)
        id: build
        shell: pwsh
        run: |
          ./build.ps1 -SkipTests   # tests already ran in the "test" job
          $version = ([regex]::Match((Get-Content converter_app/__init__.py -Raw), '__version__\s*=\s*"([^"]+)"')).Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      # ── Code signing with SignPath (releases only) ──────────────────────
      # Set up once, see docs/code-signing.md:
      #   secret   SIGNPATH_API_TOKEN
      #   variable SIGNPATH_ORGANIZATION_ID
      #   variable SIGNPATH_PROJECT_SLUG          (default: PocketConverter)
      #   variable SIGNPATH_SIGNING_POLICY_SLUG   (default: release-signing)
      # Each signing request waits until it's approved in the SignPath web app.
      - name: Check signing configuration
        id: signing
        shell: pwsh
        env:
          WANTED: ${{ inputs.sign }}
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $enabled = $env:WANTED -eq 'true' -and $env:API_TOKEN -and $env:ORGANIZATION_ID
          if ($env:WANTED -eq 'true' -and -not $enabled) {
            Write-Host "::warning::SignPath isn't configured (see docs/code-signing.md) - this release is UNSIGNED."
          }
          "enabled=$($enabled.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload converter.exe for signing
        id: unsigned-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-converter
          path: dist/converter/converter.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign converter.exe (approve the request in SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PocketConverter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.build.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800  # 3 h to approve
          output-artifact-directory: signed/app

      - name: Rebuild Setup.exe around the signed converter.exe
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/app/converter.exe dist/converter/converter.exe -Force
          ./build.ps1 -InstallerOnly

      - name: Upload Setup.exe for signing
        id: unsigned-setup
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: installer/output/PocketConverterSetup-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Setup.exe (approve the request in SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PocketConverter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.build.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed/setup

      - name: Use the signed Setup.exe and verify both signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/setup/*.exe installer/output/ -Force
          ./build.ps1 -ChecksumOnly
          foreach ($file in @('dist/converter/converter.exe') + (Get-ChildItem installer/output/*.exe).FullName) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.StatusMessage)" }
            Write-Host "$file - signed by $($signature.SignerCertificate.Subject)"
          }

      # The runner is a throwaway VM, so we can really install, upgrade and
      # uninstall the app here - something you'd never do on your own PC.
      - name: Test the installer (install / upgrade / per-user / uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/output/PocketConverterSetup-*.exe | Select-Object -First 1
          ./installer/installer-test.ps1 -Setup $setup.FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PocketConverterSetup
          path: |
            installer/output/PocketConverterSetup-*.exe
            installer/output/PocketConverterSetup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
