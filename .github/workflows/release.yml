# Continuous Delivery: merging into main publishes a release — but only
# when the merge contains a "release commit", i.e. a new version number.
#
#   1. on development: bump __version__ in converter_app/__init__.py (e.g. "2.1.0")
#      and write docs/release-notes/v2.1.0.md
#   2. open a pull request development -> main; CI must be green
#   3. merge it. This workflow builds + tests everything again and, because
#      no release v2.1.0 exists yet, tags the merge commit v2.1.0 and publishes
#      the GitHub Release with the installer and its SHA256 checksum.
#
# A merge that doesn't change the version is still built and tested, but
# nothing is published. Don't push version tags by hand; this creates them.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in a row: finish the first release before starting the next
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare __version__ with existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' converter_app/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$version already exists - build and test only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "docs/release-notes/v$version.md" ]; then
            echo "::error::New version $version but docs/release-notes/v$version.md is missing"
            exit 1
          fi
          echo "New version $version - will publish a release."
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the tag and the release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: PocketConverterSetup
          path: dist

      - name: Create tag and release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PocketConverter ${{ needs.check.outputs.version }}
          body_path: docs/release-notes/v${{ needs.check.outputs.version }}.md
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          files: |
            dist/PocketConverterSetup-*.exe
            dist/PocketConverterSetup-*.exe.sha256
          fail_on_unmatched_files: true
