# Opens a weekly pull request when a pinned dependency or a GitHub Action
# has a new version. CI then builds and smoke-tests the update before you merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
